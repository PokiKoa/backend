components:
  schemas:
    ActionEnum:
      enum:
      - read
      - create
      - update
      - discharge
      - assign_crib
      - release_crib
      - swap_crib
      - delete
      - ingest_telemetry
      - acknowledge_alert
      - resolve_alert
      - prescribe_medication
      - administer_medication
      - login_success
      - login_failed
      - logout
      - account_locked
      type: string
      description: |-
        * `read` - Lectura
        * `create` - Creación
        * `update` - Actualización
        * `discharge` - Egreso clínico
        * `assign_crib` - Asignación de cuna
        * `release_crib` - Liberación de cuna
        * `swap_crib` - Intercambio de cunas
        * `delete` - Eliminación definitiva
        * `ingest_telemetry` - Ingesta de telemetría
        * `acknowledge_alert` - Reconocimiento de alerta
        * `resolve_alert` - Resolución de alerta
        * `prescribe_medication` - Indicación médica
        * `administer_medication` - Administración de medicamento
        * `login_success` - Inicio de sesión exitoso
        * `login_failed` - Intento de inicio de sesión fallido
        * `logout` - Cierre de sesión
        * `account_locked` - Bloqueo temporal de cuenta
