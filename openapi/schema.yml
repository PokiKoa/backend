openapi: 3.0.3
info:
  title: Poki Koa API
  version: 2.0.0
  description: API REST y tiempo real para monitoreo clínico neonatal.
paths:
  /api/v1/alert-thresholds/default/:
    get:
      operationId: alert_thresholds_default_retrieve
      summary: Consulta los umbrales globales neonatales por defecto
      tags:
      - alert-thresholds
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertThresholdConfig'
          description: ''
    put:
      operationId: alert_thresholds_default_update
      summary: Actualiza los umbrales globales neonatales por defecto
      tags:
      - alert-thresholds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertThresholdConfigUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertThresholdConfigUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertThresholdConfigUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertThresholdConfig'
          description: ''
    patch:
      operationId: alert_thresholds_default_partial_update
      summary: Actualiza parcialmente los umbrales globales neonatales por defecto
      tags:
      - alert-thresholds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlertThresholdConfigUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlertThresholdConfigUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlertThresholdConfigUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertThresholdConfig'
          description: ''
  /api/v1/alerts/:
    get:
      operationId: alerts_list
      parameters:
      - in: query
        name: alert_type
        schema:
          type: string
          enum:
          - cannula
          - heart_rate
          - other
          - sensor_fault
          - spo2
          - temperature
        description: |-
          * `heart_rate` - Frecuencia Cardíaca
          * `spo2` - Saturación de Oxígeno (SpO2)
          * `temperature` - Temperatura Corporal
          * `cannula` - Cánula de Oxígeno
          * `sensor_fault` - Fallo de Sensor
          * `other` - Otra Alerta
      - in: query
        name: crib
        schema:
          type: integer
      - in: query
        name: is_open
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - info
          - warning
        description: |-
          * `info` - Informativa
          * `warning` - Advertencia
          * `critical` - Crítica
      - in: query
        name: status
        schema:
          type: string
          enum:
          - acknowledged
          - active
          - resolved
        description: |-
          * `active` - Activa
          * `acknowledged` - Reconocida
          * `resolved` - Resuelta
      - in: query
        name: triggered_after
        schema:
          type: string
          format: date-time
      - in: query
        name: triggered_before
        schema:
          type: string
          format: date-time
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
  /api/v1/alerts/{id}/:
    get:
      operationId: alerts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Alerta Clínica.
        required: true
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /api/v1/alerts/{id}/acknowledge/:
    post:
      operationId: alerts_acknowledge_create
      summary: Reconoce (acknowledge) una alerta clínica activa
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Alerta Clínica.
        required: true
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /api/v1/alerts/{id}/resolve/:
    post:
      operationId: alerts_resolve_create
      summary: Resuelve manualmente una alerta clínica
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Alerta Clínica.
        required: true
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - account_locked
          - acknowledge_alert
          - administer_medication
          - assign_crib
          - create
          - delete
          - discharge
          - ingest_telemetry
          - login_failed
          - login_success
          - logout
          - prescribe_medication
          - read
          - release_crib
          - resolve_alert
          - swap_crib
          - update
        description: |-
          * `read` - Lectura
          * `create` - Creación
          * `update` - Actualización
          * `discharge` - Egreso clínico
          * `assign_crib` - Asignación de cuna
          * `release_crib` - Liberación de cuna
          * `swap_crib` - Intercambio de cunas
          * `delete` - Eliminación definitiva
          * `ingest_telemetry` - Ingesta de telemetría
          * `acknowledge_alert` - Reconocimiento de alerta
          * `resolve_alert` - Resolución de alerta
          * `prescribe_medication` - Indicación médica
          * `administer_medication` - Administración de medicamento
          * `login_success` - Inicio de sesión exitoso
          * `login_failed` - Intento de inicio de sesión fallido
          * `logout` - Cierre de sesión
          * `account_locked` - Bloqueo temporal de cuenta
      - in: query
        name: actor_user
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: patient_id
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: timestamp_after
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp_before
        schema:
          type: string
          format: date-time
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Registro de Auditoría.
        required: true
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit-logs/summary/:
    get:
      operationId: audit_logs_summary_list
      summary: Conteo de eventos de auditoría por acción, con los mismos filtros del
        listado
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - account_locked
          - acknowledge_alert
          - administer_medication
          - assign_crib
          - create
          - delete
          - discharge
          - ingest_telemetry
          - login_failed
          - login_success
          - logout
          - prescribe_medication
          - read
          - release_crib
          - resolve_alert
          - swap_crib
          - update
        description: |-
          * `read` - Lectura
          * `create` - Creación
          * `update` - Actualización
          * `discharge` - Egreso clínico
          * `assign_crib` - Asignación de cuna
          * `release_crib` - Liberación de cuna
          * `swap_crib` - Intercambio de cunas
          * `delete` - Eliminación definitiva
          * `ingest_telemetry` - Ingesta de telemetría
          * `acknowledge_alert` - Reconocimiento de alerta
          * `resolve_alert` - Resolución de alerta
          * `prescribe_medication` - Indicación médica
          * `administer_medication` - Administración de medicamento
          * `login_success` - Inicio de sesión exitoso
          * `login_failed` - Intento de inicio de sesión fallido
          * `logout` - Cierre de sesión
          * `account_locked` - Bloqueo temporal de cuenta
      - in: query
        name: actor_user
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - in: query
        name: patient_id
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: timestamp_after
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp_before
        schema:
          type: string
          format: date-time
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditActionCount'
          description: ''
  /api/v1/auth/2fa/disable/:
    post:
      operationId: auth_2fa_disable_create
      summary: Verifica un código TOTP y desactiva 2FA en la cuenta actual
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/2fa/enable/:
    post:
      operationId: auth_2fa_enable_create
      summary: Verifica un código TOTP y activa 2FA en la cuenta actual
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/2fa/setup/:
    post:
      operationId: auth_2fa_setup_create
      summary: Genera un nuevo secreto TOTP para configurar 2FA
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupResponse'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      summary: Cambia la contraseña propia, cierra las demás sesiones y renueva los
        tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Inicia sesión; entrega el access token y deja el refresh en una cookie
        httpOnly
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Cierra sesión revocando el refresh token de la cookie y eliminándola
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Retorna el perfil del usuario autenticado
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      summary: Rota el refresh token de la cookie httpOnly y entrega un nuevo access
        token
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
