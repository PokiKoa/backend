# Proyecto: Poki Koa — Backend de monitoreo neonatal
# Gestión de dependencias y empaquetado con uv + hatchling

[project]
name = "poki_koa"
version = "2.0.0"
description = "Backend Django REST y tiempo real para el sistema de monitoreo neonatal Poki Koa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=5.2.17",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg>=3.3.6",
]

[project.scripts]
poki_koa = "poki_koa.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poki_koa", "src/accounts", "src/audit", "src/devices", "src/patients"]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "poki_koa.settings.dev"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/migrations/*",
    "*/management/*",
    "*/admin.py",
    "*/apps.py",
    "*/__init__.py",
    "*/test*.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/manage.py",
    "*/poki_koa/main.py",
    "*/poki_koa/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["RUF012", "I001"]
