# Proyecto: Poki Koa — Backend de monitoreo neonatal
# Gestión de dependencias y empaquetado con uv + hatchling

[project]
name = "poki_koa"
version = "2.0.0"
description = "Backend Django REST y tiempo real para el sistema de monitoreo neonatal Poki Koa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=5.2.17",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.34.0",
    "whitenoise>=6.9.0",
]

[project.scripts]
poki_koa = "poki_koa.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/poki_koa",
    "src/accounts",
    "src/audit",
    "src/devices",
    "src/patients",
    "src/vitals",
    "src/alerts",
    "src/medications",
    "src/reports",
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "poki_koa.settings.dev"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py"]
addopts = "-q"

[tool.coverage.run]
# Mide líneas y ramas (cada if/else, bucle y salida temprana) de todo el código
# fuente: modelos, servicios, vistas, admin, migraciones, comandos y settings.
# Solo quedan fuera los propios archivos de prueba.
branch = true
source = ["src"]
omit = [
    "*/tests.py",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
sort = "cover"
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.coverage.html]
directory = "htmlcov"
show_contexts = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["staticfiles", "htmlcov"]

[tool.ruff.format]
# Las migraciones las genera Django; no se reformatean para mantener su diff mínimo.
exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes · I: orden de imports · B: bugbear · C90/PLR: complejidad
select = ["E", "F", "W", "I", "B", "C90", "PLR0912", "PLR0915", "D"]
# El largo de línea lo gobierna `ruff format`; las cadenas y comentarios largos en español no se parten.
ignore = [
    "E501",
    "D105",  # métodos mágicos
    "D106",  # clases Meta anidadas
    "D107",  # __init__ (se documenta en la clase)
    "D203",
    "D213",
    "D205",
    "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["RUF012", "I001", "D"]
# Script lineal de datos de demostración
"src/accounts/management/commands/seed_demo.py" = ["C901", "PLR0912", "PLR0915"]
"**/tests.py" = ["C901", "PLR0912", "PLR0915", "D"]
"**/test_*.py" = ["C901", "PLR0912", "PLR0915", "D"]
"**/conftest.py" = ["D"]
# Configuración declarativa / boilerplate de Django: sin interfaz propia que documentar
"**/__init__.py" = ["D104"]
"**/apps.py" = ["D"]
"**/urls.py" = ["D"]
"**/admin.py" = ["D"]
"**/routing.py" = ["D"]
"src/poki_koa/settings/*" = ["F403", "F405", "D"]
"src/poki_koa/wsgi.py" = ["D"]
"src/poki_koa/asgi.py" = ["E402", "D"]
"src/manage.py" = ["D"]
