{% extends "admin/base.html" %}

{% block title %}{{ title }} | Poki Koa — Control Neonatal{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --primary: #0369a1;
    --secondary: #0f172a;
    --accent: #38bdf8;
    --header-bg: #0f172a;
    --header-color: #f8fafc;
    --header-link-color: #bae6fd;
  }
  #header {
    background: linear-gradient(135deg, #0f172a 0%, #0369a1 100%);
    color: #fff;
    padding: 12px 24px;
  }
  #site-name a {
    font-weight: 700;
    font-size: 1.2rem;
    color: #fff !important;
  }
  .poki-top-links {
    display: inline-flex;
    gap: 10px;
    margin-left: 18px;
    vertical-align: middle;
  }
  .poki-top-links a {
    background: rgba(255, 255, 255, 0.14);
    color: #fff !important;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
  }
  .poki-top-links a:hover {
    background: rgba(255, 255, 255, 0.25);
  }
  div.breadcrumbs {
    background: #1e293b;
  }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}">Poki Koa · Centro de Control Neonatal</a>
  <span class="poki-top-links">
    <a href="/">Vista General UCIN</a>
    <a href="/api/v1/docs/">Swagger API</a>
    <a href="/api/v1/health/">Estado del Sistema</a>
  </span>
</div>
{% endblock %}
